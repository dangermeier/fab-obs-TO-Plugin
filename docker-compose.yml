services:
  fab-obs:
    build: .
    container_name: fab-obs-to-plugin
    restart: unless-stopped

    # Host port, default 3000. If changed, PUBLIC_HOST needs the same port.
    ports:
      - "${HOST_PORT:-3000}:3000"

    volumes:
      # GEM session, settings/PIN, life totals. Lost on recreate without it.
      - ./data:/app/data

    environment:
      # Required. LAN address of the Docker host, given to the tablet. The
      # container itself only sees the bridge address (172.17.x).
      #   PUBLIC_HOST: 192.168.2.10
      #   PUBLIC_HOST: nas.local:3000        (host name works too)
      PUBLIC_HOST: "${PUBLIC_HOST:?set PUBLIC_HOST to the LAN address of this machine, e.g. 192.168.2.10}"

      # Optional. Fixed PIN for config page and tablet. Empty: random on first
      # start, kept in data/settings.json. "off": no PIN, trusted networks only.
      CONTROL_PIN: "${CONTROL_PIN:-}"

      # Optional. "on" shows the demo tournament on the config page.
      DEMO_MODE: "${DEMO_MODE:-}"

      TZ: "${TZ:-Europe/Berlin}"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/match').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
