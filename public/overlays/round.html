<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Round Status</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    /* background is on the board, not the body: a hidden overlay would
       otherwise still paint a solid rectangle over the camera */
    .overlay-frame {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.45s ease;
      overflow: hidden;
    }
    .overlay-frame.show { opacity: 1; }
    .overlay-frame.clear { background: transparent; }

    /* hidden means fully hidden, status badge included */
    #status-badge { visibility: hidden; }
    body.visible #status-badge { visibility: visible; }
  </style>
</head>
<body class="board ov-transparent">
<div class="overlay-frame" id="board">
  <div class="board-head">
    <div class="bh-main">
      <div class="bh-title"><span id="ttl">–</span><span class="bh-tag" id="tag"></span></div>
      <div class="bh-sub" id="sub"></div>
    </div>
    <div class="bh-side" id="side"></div>
    <div class="bh-bar"><div class="bh-fill" id="fill"></div></div>
  </div>
  <div class="scroll-viewport" id="vp">
    <div class="scroll-track" id="tr"></div>
  </div>
</div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const P = OV.params;
  // polls faster than the other boards: it's on screen exactly while
  // everyone waits for the last tables
  const POLL = (parseInt(P.get('refresh'), 10) || 15) * 1000;
  const HERO = P.get('hero') ? (parseInt(P.get('hero'), 10) || 38) * OV.scale : '2.1em';

  const board = document.getElementById('board');
  const list  = OV.scroller(document.getElementById('vp'), document.getElementById('tr'), { speed: 40, fit: true });
  const $ = id => document.getElementById(id);

  // solid by default (full board); ?bg=transparent drops the backing
  if (P.get('bg') === 'transparent' || P.get('bg') === 'none') board.classList.add('clear');

  function playerHtml(name, hero, cls, right) {
    return `<div class="p-pl${right ? ' r' : ''}${cls}">
      ${OV.hw(hero, HERO)}
      <div class="p-txt"><span class="p-nm">${OV.esc(OV.fmtName(name))}</span></div>
    </div>`;
  }

  function rowsHtml(pairings, heroOf) {
    if (!pairings.length) return `<div class="board-empty">${OV.t('noPairings')}</div>`;

    return pairings.map(p => {
      const w1 = p.winner === 'p1', w2 = p.winner === 'p2';
      const n  = OV.tableNo(p);

      // running tables say so; finished ones rely on the green name,
      // unless GEM gave no winner at all
      const mid = !p.done        ? `<div class="p-mid running">${OV.t('running')}</div>`
                : (!w1 && !w2)   ? `<div class="p-mid">${OV.t('finished')}</div>`
                :                  '<div class="p-mid"></div>';

      return `<div class="prow${p.done ? '' : ' live'}">
        <div class="p-tno">${n ? 'T' + n : ''}</div>
        ${playerHtml(p.p1, heroOf(p.p1GemId, p.p1), p.done ? (w1 ? ' win' : w2 ? ' lose' : '') : '', false)}
        ${mid}
        ${playerHtml(p.p2, heroOf(p.p2GemId, p.p2), p.done ? (w2 ? ' win' : w1 ? ' lose' : '') : '', true)}
      </div>`;
    }).join('');
  }

  let visible = false;
  let last = null;

  function render() {
    document.body.classList.toggle('visible', visible);
    if (!visible) { board.classList.remove('show'); return; }
    if (!last) return;                       // first load still under way

    const { tdata, heroOf } = last;
    const r = tdata.rounds.length ? tdata.rounds[tdata.rounds.length - 1] : null;
    $('sub').textContent = tdata.meta?.title || '';

    if (!r) {
      $('ttl').textContent  = OV.t('tournament');
      $('tag').textContent  = '';
      $('side').innerHTML   = '';
      $('fill').style.width = '0';
      list.show(`<div class="board-empty">${OV.t('noRound')}</div>`);
      board.classList.add('show');
      return;
    }

    const total = r.total || 0;
    const done  = Math.max(0, Math.min(total, r.done));
    const over  = total > 0 && done >= total;

    $('ttl').textContent  = OV.roundName(tdata, r);
    $('tag').textContent  = OV.t(over ? 'completed' : 'running');
    $('side').innerHTML   = `<div class="bh-num">${done}<i> / ${total}</i></div><div class="bh-note">${OV.t('tablesDone')}</div>`;
    $('fill').style.width = (total ? done / total * 100 : 0) + '%';

    const sorted = [...r.pairings].sort((a, b) => (OV.tableNo(a) || 999) - (OV.tableNo(b) || 999));
    list.show(rowsHtml(sorted, heroOf), sorted.length);

    board.classList.add('show');
  }

  async function loadRounds() {
    try {
      last = await OV.loadEvent();
      render();
      OV.badgeOk();
    } catch (err) {
      OV.badge(err.message, true);
    }
  }

  // only poll GEM while the board is on screen
  let timer = null;
  function setVisible(next) {
    if (next === visible) return;
    visible = next;
    clearInterval(timer);
    timer = null;
    if (visible) {
      loadRounds();
      timer = setInterval(loadRounds, POLL);
    } else {
      render();
    }
  }

  OV.initSettings(() => { if (visible) render(); });
  // normally waits until the featured match is confirmed on the tablet.
  // ?always=1 keeps it up: for a scene of its own, or during setup.
  const ALWAYS = ['1', 'true'].includes(P.get('always') || '');
  const wanted = m => ALWAYS || !!(m && m.ended);

  OV.onMatch(m => setVisible(wanted(m)));
  OV.onLiveState(s => { if (s === 'offline' && visible) OV.badge('Reconnecting…', true); });
  OV.onRefresh(() => { if (visible) loadRounds(); });

  // fallback if SSE never connects
  const pollMatch = () =>
    fetch('/api/match').then(r => r.json()).then(m => setVisible(wanted(m))).catch(() => { if (ALWAYS) setVisible(true); });
  setInterval(pollMatch, 30000);
  pollMatch();
</script>
</body>
</html>
