<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Featured Match</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    /* layout 1 (default): matchup screen. Hero cards left and right, what is
       being played in between.

         +---------------------+-----------+---------------------+
         |                     |  event    |                     |
         |     hero card       |  format   |     hero card       |
         |                     |  round    |                     |
         |     Player name     |  table    |     Player name     |
         |       record        |           |       record        |
         +---------------------+-----------+---------------------+

       In em off --u (20px on a 1920-wide source), like every board. */

    body.matchup { font-size: var(--u); background: transparent; }

    .mu {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 17em minmax(0, 1fr);
      opacity: 0;
      transition: opacity 0.5s;
    }
    .mu.show { opacity: 1; }

    .mu-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      min-height: 0;
      padding: 2.4em 2em 1.8em;
    }

    /* soft pool of light behind the card */
    .mu-card {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
    }
    .mu-card::before {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      width: 34em; height: 34em;
      margin: -17em 0 0 -17em;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--fx-light), transparent);
      pointer-events: none;
    }

    .mu-name {
      max-width: 100%;
      margin-top: 0.75em;
      font-family: var(--font-head);
      font-size: 2.3em;
      font-weight: 600;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mu-hero {
      max-width: 100%;
      font-size: 0.95em;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* just the record for now; the divider is there for further stats */
    .mu-stats { display: flex; justify-content: center; margin-top: 0.9em; min-height: 3.3em; }
    .mu-stat {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2em;
      padding: 0 1.7em;
      white-space: nowrap;
    }
    .mu-stat + .mu-stat::before {
      content: '';
      position: absolute;
      left: -0.36em; top: 0; bottom: 0;
      width: 0.72em;
      background: var(--sep-v);
    }
    .mu-stat .k, .mu-fact .k {
      font-size: 0.55em;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .mu-stat .v {
      font-family: var(--font-head);
      font-size: 1.5em;
      font-weight: 600;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    /* middle column: one floating panel */
    .mu-mid { display: flex; align-items: center; min-height: 0; }
    .mu-panel {
      width: 100%;
      border-radius: 0.5em;
      background: var(--surface);
      box-shadow: var(--lift-strong);
      padding: 0.6em 0;
    }
    .mu-fact {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3em;
      padding: 1.25em 1em;
      text-align: center;
    }
    .mu-fact:empty { display: none; }
    .mu-fact + .mu-fact::before {
      content: '';
      position: absolute;
      left: 9%; right: 9%; top: -0.36em;
      height: 0.72em;
      background: var(--sep-h);
    }
    .mu-fact .v {
      font-family: var(--font-head);
      font-size: 1.55em;
      font-weight: 600;
      line-height: 1.2;
    }

    /* layout 2 (?layout=banner): lower third over the camera.
       Sizes off --scale, so ?scale= just works. */

    body.lower {
      display: flex;
      justify-content: center;
      padding: var(--margin) 24px;
      font-size: calc(18px * var(--scale));
    }
    body.pos-bottom { align-items: flex-end; }
    body.pos-top    { align-items: flex-start; }
    body.pos-center { align-items: center; }

    /* fixed width, not shrink-to-fit: long hero names ("Kayo, Armed and
       Dangerous") need the room, and a lower third that changes width every
       round looks wrong on stream */
    .banner {
      display: flex;
      align-items: stretch;
      gap: 1.5em;
      padding: 1em 1.6em;
      width: min(62em, 96vw);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .banner.show { opacity: 1; }

    .side {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 0.9em;
      min-width: 0;
    }
    .side.r { flex-direction: row-reverse; }

    .info { min-width: 0; display: flex; flex-direction: column; gap: 0.15em; }
    .side.r .info { align-items: flex-end; text-align: right; }

    .pname { font-size: 1.5em; font-weight: 600; }
    .phero { font-size: 1.05em; }
    .rec   { font-size: 0.85em; }

    /* centre: round, table, then VS or the live life totals */
    .center {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2em;
      position: relative;
      padding: 0 1.1em;
      min-width: 8em;
    }
    .center::before, .center::after {
      content: '';
      position: absolute;
      top: 4%; bottom: 4%;
      width: 0.72em;
      background: var(--sep-v);
      pointer-events: none;
    }
    .center::before { left:  -0.36em; }
    .center::after  { right: -0.36em; }

    /* banner content is re-rendered on every update; this wrapper keeps the
       animation layer next to it alive */
    #content { display: contents; }
    .round {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 1.25em;
      color: var(--text);
      white-space: nowrap;
    }
    .table {
      font-size: 0.72em;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .vs {
      font-family: var(--font-head);
      font-size: 1.1em;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 0.2em;
    }
    .life {
      display: flex;
      align-items: baseline;
      gap: 0.35em;
      font-family: var(--font-head);
      font-size: 2.2em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      margin-top: 0.08em;
    }
    .life .sep { font-size: 0.55em; color: var(--text-dim); }
  </style>
</head>
<body>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const P = OV.params;
  const BANNER = P.get('layout') === 'banner';

  // --- layout 1: matchup screen ---

  function matchupLayout() {
    const b = document.body;
    b.classList.add('matchup', 'themed', 'ov-transparent');
    OV.paintTheme();

    const side = cls => `<div class="mu-side ${cls}">
        <div class="mu-card"></div>
        <div class="mu-name">–</div>
        <div class="mu-hero"></div>
        <div class="mu-stats"></div>
      </div>`;

    // shell built once, only texts and cards change afterwards
    const frame = document.createElement('div');
    frame.className = 'overlay-frame mu';
    frame.innerHTML = side('l') +
      `<div class="mu-mid"><div class="mu-panel">
         <div class="mu-fact" id="f-event"></div><div class="mu-fact" id="f-format"></div>
         <div class="mu-fact" id="f-round"></div><div class="mu-fact" id="f-table"></div>
       </div></div>` + side('r');
    b.appendChild(frame);
    OV.fx(frame, { motes: 34, glows: true });

    const sides = [...frame.querySelectorAll('.mu-side')].map(el => ({
      stage: OV.cardStage(el.querySelector('.mu-card')),
      name:  el.querySelector('.mu-name'),
      hero:  el.querySelector('.mu-hero'),
      stats: el.querySelector('.mu-stats')
    }));

    const fact = (id, label, value) => { frame.querySelector('#' + id).innerHTML = OV.kv(label, value); };

    function update(s, p, life) {
      const hero = (p && p.hero) || null;
      // whole hero card; a new match turns it over
      s.stage.set(hero ? { images: [OV.heroImageUrl(hero)] } : null);
      s.name.textContent = OV.playerName(p);
      s.hero.textContent = hero || '';

      // record only: life and class are printed on the card right above.
      // 0-0 is left out.
      const stats = [
        p && (p.wins || p.losses) ? [OV.t('lblRecord'), `${p.wins}–${p.losses}`] : null
      ].filter(Boolean);
      const html = stats.map(([k, v]) => `<div class="mu-stat">${OV.kv(k, v)}</div>`).join('');
      if (s.stats.innerHTML !== html) s.stats.innerHTML = html;
    }

    return {
      hide() { frame.classList.remove('show'); },
      // No match yet: the frame stays up and says what it is waiting for.
      wait(m, text) {
        sides.forEach(s => { update(s, null); s.name.textContent = ''; });
        fact('f-event',  OV.t('lblEvent'), m.eventTitle);
        fact('f-format', '', '');
        fact('f-round',  OV.t('lblMatch'), text);
        fact('f-table',  '', '');
        frame.classList.add('show');
      },
      draw(m, l, r) {
        update(sides[0], m[l], m.life[l]);
        update(sides[1], m[r], m.life[r]);
        fact('f-event',  OV.t('lblEvent'),  m.eventTitle);
        fact('f-format', OV.t('lblFormat'), m.format);
        fact('f-round',  OV.t('lblRound'),  OV.matchRoundValue(m));
        fact('f-table',  OV.t('lblTable'),  m.table);
        frame.classList.add('show');
      }
    };
  }

  // --- layout 2: lower-third banner ---

  function bannerLayout() {
    const SOLID    = P.get('bg') === 'solid';
    const SHOWLIFE = P.get('life') === '1' || P.get('life') === 'true';
    const POS      = ['top', 'center', 'bottom'].includes(P.get('pos')) ? P.get('pos') : 'bottom';
    const HERO_PX  = Math.round((parseInt(P.get('hero'), 10) || 84) * OV.scale);

    // floats over the camera, so always the dark surface
    document.documentElement.style.setProperty('--margin', (parseInt(P.get('margin'), 10) || 48) + 'px');
    document.body.classList.add('surface-dark', 'lower', 'pos-' + POS);
    if (!SOLID) document.body.classList.add('ov-transparent');

    const banner = document.createElement('div');
    banner.className = 'banner ' + (SOLID ? 'ov-panel' : 'ov-floating');
    banner.innerHTML = '<div id="content"></div>';
    document.body.insertBefore(banner, document.body.firstChild);
    const content = banner.firstChild;
    OV.fx(banner, { motes: 18 });

    function playerHtml(p, right) {
      const hero = (p && p.hero) || null;
      // no 0-0, it's noise before round 1 and in manual mode
      const rec  = p && (p.wins || p.losses)
        ? `<div class="rec ov-prec">${p.wins}–${p.losses}</div>` : '';

      return `<div class="side${right ? ' r' : ''}">
        ${OV.hw(hero, HERO_PX)}
        <div class="info">
          <div class="pname ov-pname">${OV.esc(OV.playerName(p))}</div>
          <div class="phero ov-phero">${OV.esc(hero || '—')}</div>
          ${rec}
        </div>
      </div>`;
    }

    function centerHtml(m, l, r) {
      const middle = SHOWLIFE
        ? `<div class="life"><span>${m.life[l] ?? '–'}</span><span class="sep">–</span><span>${m.life[r] ?? '–'}</span></div>`
        : '<div class="vs">VS</div>';

      return `<div class="center">
        <div class="round">${OV.esc(m.roundStage || !m.round ? OV.matchRoundName(m) : OV.t('round', { n: OV.matchRoundValue(m) }))}</div>
        ${m.table ? `<div class="table">${OV.esc(OV.t('table', { n: m.table }))}</div>` : ''}
        ${middle}
      </div>`;
    }

    return {
      // unconfigured source stays invisible instead of burning text into
      // the stream; the status badge says why
      hide() { banner.classList.remove('show'); },
      draw(m, l, r) {
        content.innerHTML = playerHtml(m[l], false) + centerHtml(m, l, r) + playerHtml(m[r], true);
        banner.classList.add('show');
      }
    };
  }

  // --- shared wiring ---

  const view = BANNER ? bannerLayout() : matchupLayout();
  let last = null;

  function render() {
    const m = last;
    if (!m || (!m.p1 && !m.p2)) {
      // the banner floats over the camera and stays away instead
      const note = m && m.warning ? m.warning : 'No featured match';
      if (view.wait) { view.wait(m || {}, OV.matchWaiting(m)); OV.badgeQuiet(note); }
      else { view.hide(); OV.badge(note, !!(m && m.warning)); }
      return;
    }

    OV.setFormat(m.format);
    const [l, r] = m.swapped ? ['p2', 'p1'] : ['p1', 'p2'];
    view.draw(m, l, r);
    if (m.warning) OV.badge(m.warning, true); else OV.badgeOk();
  }

  OV.initSettings(render);
  OV.followMatch(m => { last = m; render(); });
</script>
</body>
</html>
