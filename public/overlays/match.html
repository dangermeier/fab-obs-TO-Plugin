<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Featured Match</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    /* Everything sizes off --scale so ?scale= works without touching the layout */
    body {
      display: flex;
      justify-content: center;
      padding: var(--margin) 24px;
      font-size: calc(18px * var(--scale));
    }
    body.pos-bottom { align-items: flex-end; }
    body.pos-top    { align-items: flex-start; }
    body.pos-center { align-items: center; }

    /* Fixed width rather than shrink-to-fit: long hero names like
       "Kayo, Armed and Dangerous" need the room, and a lower third that
       changes width every round looks wrong on stream. Sized in em so
       ?scale= still works. */
    .banner {
      display: flex;
      align-items: stretch;
      gap: 1.5em;
      padding: 1em 1.6em;
      width: min(62em, 96vw);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .banner.show { opacity: 1; }

    .side {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 0.9em;
      min-width: 0;
    }
    .side.r { flex-direction: row-reverse; }

    .info { min-width: 0; display: flex; flex-direction: column; gap: 0.15em; }
    .side.r .info { align-items: flex-end; text-align: right; }

    .pname { font-size: 1.5em; font-weight: 600; }
    .phero { font-size: 1.05em; }
    .rec   { font-size: 0.85em; }

    /* Centre column: round, table, and either VS or the live life totals */
    .center {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2em;
      padding: 0 0.6em;
      border-left:  1px solid var(--line);
      border-right: 1px solid var(--line);
      min-width: 8em;
    }
    .round {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 1.25em;
      color: var(--text);
      white-space: nowrap;
    }
    .table {
      font-size: 0.72em;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .vs {
      font-family: var(--font-head);
      font-size: 1.1em;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 0.2em;
    }
    .life {
      display: flex;
      align-items: baseline;
      gap: 0.35em;
      font-family: var(--font-head);
      font-size: 2.2em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      margin-top: 0.08em;
    }
    .life .sep { font-size: 0.55em; color: var(--text-dim); }
  </style>
</head>
<!-- Floats over the camera feed, so it always uses the dark surface. -->
<body class="surface-dark">
<div class="banner" id="banner"></div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const P       = OV.params;
  const SOLID   = P.get('bg') === 'solid';
  const SHOWLIFE = P.get('life') === '1' || P.get('life') === 'true';
  const POS     = ['top', 'center', 'bottom'].includes(P.get('pos')) ? P.get('pos') : 'bottom';
  const SCALE   = parseFloat(P.get('scale')) || 1;
  const HERO_PX = Math.round((parseInt(P.get('hero'), 10) || 84) * SCALE);

  document.documentElement.style.setProperty('--scale',  SCALE);
  document.documentElement.style.setProperty('--margin', (parseInt(P.get('margin'), 10) || 48) + 'px');
  document.body.classList.add('pos-' + POS);
  if (SOLID) document.body.classList.add('solid');
  else document.body.classList.add('ov-transparent');

  const banner = document.getElementById('banner');
  banner.classList.add(SOLID ? 'ov-panel' : 'ov-floating');

  let last = null;

  function playerHtml(p, right) {
    const name = OV.fmtName(p && p.name);
    const hero = (p && p.hero) || null;
    // 0–0 says nothing — before round 1 and in manual mode it is just noise.
    const rec  = p && (p.wins || p.losses)
      ? `<div class="rec ov-prec">${p.wins}–${p.losses}</div>` : '';

    return `<div class="side${right ? ' r' : ''}">
      ${OV.hw(hero, HERO_PX)}
      <div class="info">
        <div class="pname ov-pname">${OV.esc(name)}</div>
        <div class="phero ov-phero">${OV.esc(hero || '—')}</div>
        ${rec}
      </div>
    </div>`;
  }

  function centerHtml(m, l, r) {
    const round = m.roundLabel || (m.round ? `Round ${m.round}` : '');
    const total = m.totalRounds && m.round && !/final|semi|quarter|round of/i.test(round)
      ? ` / ${m.totalRounds}` : '';

    const middle = SHOWLIFE
      ? `<div class="life"><span>${m.life[l] ?? '–'}</span><span class="sep">–</span><span>${m.life[r] ?? '–'}</span></div>`
      : '<div class="vs">VS</div>';

    return `<div class="center">
      <div class="round">${OV.esc(round + total)}</div>
      ${m.table ? `<div class="table">Table ${OV.esc(m.table)}</div>` : ''}
      ${middle}
    </div>`;
  }

  function render() {
    const m = last;
    if (!m || (!m.p1 && !m.p2)) {
      // An unconfigured source stays invisible rather than burning text into
      // the stream — the status badge says why.
      banner.classList.remove('show');
      OV.badge(m && m.warning ? m.warning : 'No featured match', !!(m && m.warning));
      return;
    }

    OV.setFormat(m.format);
    const [l, r] = m.swapped ? ['p2', 'p1'] : ['p1', 'p2'];

    banner.innerHTML = playerHtml(m[l], false) + centerHtml(m, l, r) + playerHtml(m[r], true);
    banner.classList.add('show');
    OV.badge(m.warning || 'Live', !!m.warning);
  }

  OV.initSettings(render);
  OV.onMatch(m => { last = m; render(); });
  OV.onLiveState(s => { if (s === 'offline') OV.badge('Reconnecting…', true); });

  // Fallback for the rare case SSE never establishes.
  function poll() {
    fetch('/api/match')
      .then(r => r.json())
      .then(m => { if (!last || m.rev >= last.rev) { last = m; render(); } })
      .catch(() => {});
  }
  poll();
  setInterval(poll, OV.refreshMs);
</script>
</body>
</html>
