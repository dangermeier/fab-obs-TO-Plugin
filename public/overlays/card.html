<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Card</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    /* Just the card, full source height, transparent page. For layouts without
       the broadcast frame. ?align=left|right pins it to that edge.
       Entrance/exit is .card-stage in overlay.css (OV.cardStage); the padding
       leaves room for its shadow and the entrance swing. */
    #stage { position: fixed; inset: 0; padding: 4vh; }
    body.left  #stage { justify-items: start; }
    body.right #stage { justify-items: end; }
  </style>
</head>
<body class="ov-transparent">
<div id="stage"></div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const stage = OV.cardStage(document.getElementById('stage'));
  const ALIGN = OV.params.get('align');
  if (ALIGN === 'left' || ALIGN === 'right') document.body.classList.add(ALIGN);

  // life taps come in on the same channel; the stage ignores an unchanged card
  function render(m) {
    stage.set((m && m.card) || null);
    OV.badgeOk();
  }

  OV.followMatch(render);
</script>
</body>
</html>
