<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Hero Breakdown</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    /* The rows share the frame's height: up to 4.4em each, and evenly thinner
       once there are more heroes than fit — nothing scrolls and nothing is
       scaled, so the board always fills the source edge to edge. */
    .bars {
      flex: 1;
      min-height: 0;
      display: grid;
      align-content: center;
      padding: 0.6em max(1.6em, calc((100% - 78em) / 2));
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 1em;
      min-height: 0;
      padding: 0.28em 0;
    }
    /* Portrait takes the row's height, whatever that turns out to be. */
    .bar-row .hero-wrap { align-self: stretch; aspect-ratio: 1 / 1; }

    .hero-name {
      width: 15em;
      flex-shrink: 0;
      font-size: 1.1em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      height: 0.8em;
      border-radius: 1em;
      background: var(--bg-sunken);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.25);
    }
    .bar-fill {
      height: 100%;
      border-radius: 1em;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent));
      box-shadow: var(--glow);
      transform-origin: left;
      animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
    .bar-row.rest .bar-fill { background: var(--text-dim); box-shadow: none; }

    .bar-stat {
      width: 6.2em;
      flex-shrink: 0;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 0.5em;
      font-variant-numeric: tabular-nums;
    }
    .bar-stat .n { font-family: var(--font-head); font-size: 1.5em; font-weight: 700; color: var(--text); }
    .bar-stat .p { width: 3.6em; text-align: right; font-size: 0.8em; color: var(--text-dim); }

    .board-empty { align-self: center; }
  </style>
</head>
<body class="board">
<div class="overlay-frame">
  <div class="board-head">
    <div class="bh-main">
      <div class="bh-title"><span id="ttl">–</span></div>
      <div class="bh-sub" id="sub"></div>
    </div>
    <div class="bh-side" id="side"></div>
  </div>
  <div class="bars" id="bars"></div>
</div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const REFRESH  = OV.refreshMs;
  // Beyond this the rows get too thin to read on stream; the tail is summed up.
  const MAX_ROWS = Math.max(4, parseInt(OV.params.get('max'), 10) || 18);
  const bars = document.getElementById('bars');
  const $ = id => document.getElementById(id);

  let last = null, shown = null;

  function render() {
    if (!last) return;
    const { tdata, heroes } = last;

    const counts = {};
    heroes.forEach(h => { if (h.hero) counts[h.hero] = (counts[h.hero] || 0) + 1; });
    // Ties in a fixed order, so equal bars do not swap places between refreshes.
    let rows = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

    const kinds = rows.length;
    const total = rows.reduce((n, r) => n + r[1], 0);
    const max   = rows[0]?.[1] || 1;

    $('ttl').textContent = OV.t('breakdown');
    $('sub').textContent = tdata.meta?.title || '';
    $('side').innerHTML  = kinds
      ? `<div class="bh-num">${kinds}<i> ${OV.t('heroes')}</i></div><div class="bh-note">${total} ${OV.t('players')}</div>` : '';

    let html;
    if (!kinds) {
      html = `<div class="board-empty">${OV.t('noHeroes')}</div>`;
      bars.style.gridTemplateRows = '';
    } else {
      let rest = null;
      if (rows.length > MAX_ROWS) {
        const tail = rows.slice(MAX_ROWS - 1);
        rest = [OV.t('others', { n: tail.length }), tail.reduce((n, r) => n + r[1], 0)];
        rows = rows.slice(0, MAX_ROWS - 1);
      }

      const row = ([hero, count], isRest) => `<div class="bar-row${isRest ? ' rest' : ''}">
          ${isRest ? '<div class="hero-wrap"><div class="hero-ph">+</div></div>' : OV.hw(hero, null)}
          <div class="hero-name">${OV.esc(hero)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(count / max * 100).toFixed(1)}%"></div></div>
          <div class="bar-stat"><span class="n">${count}</span><span class="p">${(count / total * 100).toFixed(1)}%</span></div>
        </div>`;

      html = rows.map(r => row(r, false)).join('') + (rest ? row(rest, true) : '');
      bars.style.gridTemplateRows = `repeat(${rows.length + (rest ? 1 : 0)}, minmax(0, 4.4em))`;
    }

    // Untouched data is a no-op: no re-render, no artwork fading in again.
    if (html !== shown) { bars.innerHTML = html; shown = html; }
  }

  async function refresh() {
    try {
      last = await OV.loadEvent();
      render();
      OV.badgeOk(Math.round(REFRESH / 1000));
    } catch (err) {
      OV.badge(err.message, true);
    }
  }

  OV.initSettings(render).then(refresh);
  setInterval(refresh, REFRESH);
  OV.onRefresh(refresh);
</script>
</body>
</html>
