<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Bracket</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    body { display: flex; flex-direction: column; }

    /* Full-viewport flex layout — no JS scaling needed */
    .overlay-frame { flex: 1; }

    .bheader {
      flex-shrink: 0;
      padding: 13px 24px 11px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-raised);
    }
    .btitle {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: clamp(17px, 2vw, 23px);
      color: var(--text);
    }
    .bsubtitle { font-size: clamp(10px, 1.2vw, 13px); color: var(--text-dim); margin-top: 3px; }

    /* Grid: all rounds side-by-side */
    .bracket-grid {
      flex: 1;
      display: flex;
      padding: 14px 56px 20px;
      gap: 48px;
      min-height: 0;
    }

    /* One column per round */
    .round-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .round-label {
      flex-shrink: 0;
      text-align: center;
      font-family: var(--font-head);
      font-size: clamp(12px, 1.25vw, 16px);
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .round-matches {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* Each match occupies flex-grow proportional to 2^roundIndex */
    .match-slot {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: 5px 0;
    }

    .match-card {
      border: 1px solid var(--line);
      border-left: 3px solid var(--line-strong);
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: clamp(140px, 22vh, 240px); /* cap so Finals card isn't enormous */
      background: var(--bg-raised);
      box-shadow: var(--shadow);
    }

    .pcard {
      flex: 1;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }
    .pcard:last-child { border-bottom: none; }
    .pcard.winner { background: var(--accent-tint); }
    .pcard.loser  { opacity: 0.45; }

    .pcard-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
    .pcard-name {
      font-size: clamp(11px, 1.3vw, 15px);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .pcard.winner .pcard-name { color: var(--win); font-weight: 700; }
    .pcard.loser  .pcard-name { color: var(--text-dim); }
    .pcard-hero {
      font-size: clamp(9px, 1vw, 12px);
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .champion {
      font-family: var(--font-head);
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .no-data { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 16px; }
  </style>
</head>
<body>
<div class="overlay-frame" id="frame">
  <div id="content-area" style="display:flex;flex-direction:column;height:100%">
    <div class="no-data">Loading…</div>
  </div>
</div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const REFRESH = OV.refreshMs;
  const area = document.getElementById('content-area');

  const ROUND_LABELS = ['Round of 16', 'Quarterfinals', 'Semifinals', 'Finals'];

  function render(tdata, heroes) {
    const elim = tdata.rounds.filter(r => r.elimination).sort((a, b) => a.round - b.round);

    if (!elim.length) {
      area.innerHTML = '<div class="no-data">No elimination rounds yet</div>';
      return;
    }

    const byId = {}, byN = {};
    heroes.forEach(h => {
      if (h.gemId && h.hero) byId[h.gemId] = h.hero;
      if (h.name  && h.hero) byN[h.name.toLowerCase()] = h.hero;
    });

    // Sort pairings by table within each round
    elim.forEach(r => r.pairings.sort((a, b) => {
      const n = s => typeof s.table === 'number' ? s.table : (parseInt(String(s.table).replace(/\D/g,'')) || 999);
      return n(a) - n(b);
    }));

    const first = elim[0].pairings.length;
    const numRounds = elim.length;
    const labelStart = first >= 8 ? 0 : first >= 4 ? 1 : first >= 2 ? 2 : 3;
    const isLast = ri => ri === numRounds - 1;

    const cols = elim.map((round, ri) => {
      const flexGrow = Math.pow(2, ri); // 1, 2, 4, 8...
      const label = ROUND_LABELS[Math.min(labelStart + ri, ROUND_LABELS.length - 1)] || `Round ${round.round}`;

      const slots = round.pairings.map(p => {
        const h1 = byId[p.p1GemId] || byN[(p.p1||'').toLowerCase()] || null;
        const h2 = byId[p.p2GemId] || byN[(p.p2||'').toLowerCase()] || null;
        const w1 = p.winner === 'p1', w2 = p.winner === 'p2';
        const champ = isLast(ri) && p.done;

        return `<div class="match-slot" style="flex:${flexGrow}">
          <div class="match-card">
            <div class="pcard${w1?' winner':p.done&&w2?' loser':''}">
              ${OV.hw(h1, 52)}
              <div class="pcard-info">
                <div class="pcard-name">${OV.esc(OV.fmtName(p.p1))}</div>
                ${h1 ? `<div class="pcard-hero">${OV.esc(h1)}</div>` : ''}
              </div>
              ${champ && w1 ? '<div class="champion">Champion</div>' : ''}
            </div>
            <div class="pcard${w2?' winner':p.done&&w1?' loser':''}">
              ${OV.hw(h2, 52)}
              <div class="pcard-info">
                <div class="pcard-name">${OV.esc(OV.fmtName(p.p2))}</div>
                ${h2 ? `<div class="pcard-hero">${OV.esc(h2)}</div>` : ''}
              </div>
              ${champ && w2 ? '<div class="champion">Champion</div>' : ''}
            </div>
          </div>
        </div>`;
      }).join('');

      return `<div class="round-col">
        <div class="round-label">${label}</div>
        <div class="round-matches">${slots}</div>
      </div>`;
    }).join('');

    area.innerHTML = `
      <div class="bheader">
        <div class="btitle">${OV.esc(tdata.meta?.title || 'FAB Top Cut')}</div>
        <div class="bsubtitle">Top Cut · Rounds ${elim.map(r => r.round).join(', ')}</div>
      </div>
      <div class="bracket-grid">${cols}</div>`;
  }

  let last = null;

  async function refresh() {
    try {
      const q = OV.query;
      const [tdRes, hRes] = await Promise.all([fetch(`/api/tournament${q}`), fetch(`/api/heroes${q}`)]);
      if (tdRes.status === 401) { OV.badge('Not logged in', true); return; }
      if (!tdRes.ok) throw new Error(`HTTP ${tdRes.status}`);
      const tdata  = await tdRes.json();
      const heroes = await hRes.json().catch(() => []);
      if (tdata.error) throw new Error(tdata.error);

      OV.setFormat(tdata.meta?.format);
      last = { tdata, heroes };
      render(tdata, heroes);
      OV.badgeOk(Math.round(REFRESH / 1000));
    } catch (err) {
      OV.badge('Error: ' + err.message, true);
    }
  }

  // Switching the name mode in the config UI re-renders without an OBS reload.
  OV.initSettings(() => { if (last) render(last.tdata, last.heroes); }).then(refresh);

  setInterval(refresh, REFRESH);
</script>
</body>
</html>
