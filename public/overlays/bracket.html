<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Bracket</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    .bracket-grid {
      --gap: 3.2em;
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      gap: var(--gap);
      padding: 0.9em 2.4em 1.2em;
    }

    .round-col {
      flex: 1 1 0;
      max-width: 32em;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .round-label {
      flex-shrink: 0;
      margin-bottom: 0.5em;
      font-family: var(--font-head);
      font-size: 1.05em;
      font-weight: 600;
      color: var(--text-dim);
    }
    .round-col.current .round-label { color: var(--accent); }

    .round-matches { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    /* equal slots, card centred: a next-round card lands exactly between its two feeders */
    .match-slot {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.3em 0;
    }

    /* connectors, only where a round really halves into the next */
    .round-col.feeds .match-slot::after,
    .round-col.fed   .match-slot::before {
      content: '';
      position: absolute;
      width: calc(var(--gap) / 2);
      border: 0 solid var(--line-strong);
    }
    .round-col.fed .match-slot::before { left: calc(var(--gap) / -2); top: 50%; border-top-width: 0.1em; }
    .round-col.feeds .match-slot::after { right: calc(var(--gap) / -2); border-right-width: 0.1em; }
    .round-col.feeds .match-slot:nth-child(odd)::after  { top: 50%; bottom: 0;    border-top-width: 0.1em; }
    .round-col.feeds .match-slot:nth-child(even)::after { top: 0;   bottom: 50%; border-bottom-width: 0.1em; }

    .match-card {
      display: flex;
      flex-direction: column;
      max-height: 8.6em;
      flex: 1 1 auto;
      min-height: 0;
      border-radius: 0.45em;
      background: var(--surface);
      box-shadow: var(--lift);
      overflow: hidden;
    }

    .pcard {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 0.7em;
      padding: 0.35em 0.8em;
      overflow: hidden;
    }
    /* divider with the star, between the two players */
    .match-card { position: relative; }
    .match-card::after {
      content: '';
      position: absolute;
      left: 6%; right: 6%; top: 50%;
      height: 0.72em;
      margin-top: -0.36em;
      background: var(--sep-h);
      pointer-events: none;
    }
    .pcard.winner { background: linear-gradient(90deg, var(--accent-tint), transparent 85%); box-shadow: inset 0.22em 0 0 var(--win); }
    .pcard.loser .hero-wrap { opacity: 0.45; }

    .pcard-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.05em; }
    .pcard-name, .pcard-hero { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pcard-name { font-size: 1.15em; line-height: 1.2; color: var(--text); }
    .pcard-hero { font-size: 0.75em; line-height: 1.25; color: var(--text-dim); }
    .pcard.winner .pcard-name { color: var(--win); font-weight: 700; }
    .pcard.loser  .pcard-name { color: var(--text-dim); }

    .champion {
      flex-shrink: 0;
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .board-empty { flex: 1; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="board">
<div class="overlay-frame">
  <div class="board-head">
    <div class="bh-main">
      <div class="bh-title"><span id="ttl">–</span><span class="bh-tag" id="tag"></span></div>
      <div class="bh-sub" id="sub"></div>
    </div>
  </div>
  <div class="bracket-grid" id="grid"></div>
</div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const REFRESH = OV.refreshMs;
  const grid = document.getElementById('grid');
  const $ = id => document.getElementById(id);

  const byTable = (a, b) => (OV.tableNo(a) || 999) - (OV.tableNo(b) || 999);

  // gemId decides if both sides have one, else the name
  function samePlayer(g1, n1, g2, n2) {
    if (g1 && g2) return g1 === g2;
    const k = OV.nameKey(n1);
    return !!k && k === OV.nameKey(n2);
  }

  // GEM numbers tables per round, so QF table 1 need not feed SF table 1.
  // Walk back from the final and put each match next to the one its winner
  // went on to, or the connectors join the wrong cards.
  function orderRounds(elim) {
    const rounds = elim.map(r => [...r.pairings].sort(byTable));

    for (let k = rounds.length - 2; k >= 0; k--) {
      const cur = rounds[k], used = new Set(), placed = [];

      rounds[k + 1].forEach(m => [[m.p1GemId, m.p1], [m.p2GemId, m.p2]].forEach(([g, n]) => {
        const i = cur.findIndex((c, ci) => !used.has(ci) &&
          (samePlayer(g, n, c.p1GemId, c.p1) || samePlayer(g, n, c.p2GemId, c.p2)));
        if (i >= 0) { used.add(i); placed.push(cur[i]); }
      }));

      cur.forEach((c, i) => { if (!used.has(i)) placed.push(c); });
      rounds[k] = placed;
    }
    return rounds;
  }

  function playerHtml(name, hero, cls, champ) {
    return `<div class="pcard${cls}">
      ${OV.hw(hero, '2.7em')}
      <div class="pcard-info">
        <div class="pcard-name">${OV.esc(OV.fmtName(name))}</div>
        ${hero ? `<div class="pcard-hero">${OV.esc(hero)}</div>` : ''}
      </div>
      ${champ ? `<div class="champion">${OV.t('champion')}</div>` : ''}
    </div>`;
  }

  let last = null, shown = null;

  function render() {
    if (!last) return;
    const { tdata, heroOf } = last;
    const elim = tdata.rounds.filter(r => r.elimination).sort((a, b) => a.round - b.round);

    $('ttl').textContent = OV.t('topCut');
    $('sub').textContent = tdata.meta?.title || '';
    $('tag').textContent = elim.length ? 'Top ' + elim[0].pairings.length * 2 : '';

    let html;
    if (!elim.length) {
      html = `<div class="board-empty">${OV.t('noBracket')}</div>`;
    } else {
      const rounds = orderRounds(elim);
      const final  = elim.length - 1;
      const halves = i => i < final && rounds[i].length === rounds[i + 1].length * 2;

      html = elim.map((round, ri) => {
        const live = round.pairings.some(p => !p.done);
        const cls  = (halves(ri) ? ' feeds' : '') + (ri > 0 && halves(ri - 1) ? ' fed' : '') +
                     (live ? ' current' : '');

        const slots = rounds[ri].map(p => {
          const w1 = p.winner === 'p1', w2 = p.winner === 'p2';
          const champ = ri === final && rounds[ri].length === 1 && p.done;
          return `<div class="match-slot"><div class="match-card">
            ${playerHtml(p.p1, heroOf(p.p1GemId, p.p1), w1 ? ' winner' : w2 ? ' loser' : '', champ && w1)}
            ${playerHtml(p.p2, heroOf(p.p2GemId, p.p2), w2 ? ' winner' : w1 ? ' loser' : '', champ && w2)}
          </div></div>`;
        }).join('');

        return `<div class="round-col${cls}">
          <div class="round-label">${OV.esc(OV.roundName(tdata, round))}</div>
          <div class="round-matches">${slots}</div>
        </div>`;
      }).join('');
    }

    // same html: skip, or the artwork fades in again
    if (html !== shown) { grid.innerHTML = html; shown = html; }
  }

  async function refresh() {
    try {
      last = await OV.loadEvent();
      render();
      OV.badgeOk(Math.round(REFRESH / 1000));
    } catch (err) {
      OV.badge(err.message, true);
    }
  }

  // name mode and language switch live, no OBS reload needed
  OV.initSettings(render).then(refresh);
  setInterval(refresh, REFRESH);
  OV.onRefresh(refresh);
</script>
</body>
</html>
