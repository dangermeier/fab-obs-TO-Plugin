<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Pairings</title>
  <link rel="stylesheet" href="/shared/overlay.css">
</head>
<body class="board">
<div class="overlay-frame">
  <div class="board-head">
    <div class="bh-main">
      <div class="bh-title"><span id="ttl">–</span><span class="bh-tag" id="tag"></span></div>
      <div class="bh-sub" id="sub"></div>
    </div>
    <div class="bh-side" id="side"></div>
    <div class="bh-bar"><div class="bh-fill" id="fill"></div></div>
  </div>
  <div class="scroll-viewport" id="vp">
    <div class="scroll-track" id="tr"></div>
  </div>
</div>
<div class="tk">
  <div class="tk-label">
    <div class="tk-ttl" id="tk-ttl">–</div>
    <div class="tk-sub" id="tk-sub"></div>
  </div>
  <div class="tk-view" id="tk-view"><div class="tk-track" id="tk-track"></div></div>
</div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const REFRESH = OV.refreshMs;
  const $ = id => document.getElementById(id);
  // ?mode=ticker: the same data as a one-line strip instead of the board.
  const ticker = OV.initTicker();
  const list = ticker ||
    OV.scroller($('vp'), $('tr'), { fit: true, speed: OV.speed });

  function playerHtml(name, hero, cls, right) {
    return `<div class="p-pl${right ? ' r' : ''}${cls}">
      ${OV.hw(hero, '2.5em')}
      <div class="p-txt">
        <span class="p-nm">${OV.esc(OV.fmtName(name))}</span>
        ${hero ? `<span class="p-hero">${OV.esc(hero)}</span>` : ''}
      </div>
    </div>`;
  }

  function rowsHtml(pairings, heroOf) {
    if (!pairings.length) return `<div class="board-empty">${OV.t('noPairings')}</div>`;

    return pairings.map(p => {
      const w1 = p.winner === 'p1', w2 = p.winner === 'p2';
      const n  = OV.tableNo(p);
      // Finished tables rely on the green name; only a result without a
      // winner (draw, double loss) needs a word.
      const mid = !p.done ? OV.t('vs') : (!w1 && !w2) ? OV.t('finished') : '';

      return `<div class="prow">
        <div class="p-tno">${n ? 'T' + n : ''}</div>
        ${playerHtml(p.p1, heroOf(p.p1GemId, p.p1), w1 ? ' win' : w2 ? ' lose' : '', false)}
        <div class="p-mid">${mid}</div>
        ${playerHtml(p.p2, heroOf(p.p2GemId, p.p2), w2 ? ' win' : w1 ? ' lose' : '', true)}
      </div>`;
    }).join('');
  }

  // Ticker cell: the table, then the two players under each other, each with
  // portrait and the record they brought into this round.
  function tickerHtml(pairings, heroOf, recOf) {
    if (!pairings.length) return `<div class="tk-empty">${OV.t('noPairings')}</div>`;

    const row = (name, gemId, cls) => `<div class="tk-row${cls}">
        ${OV.hw(heroOf(gemId, name), null)}
        <span class="tk-nm">${OV.esc(OV.fmtName(name))}</span>
        <span class="tk-rec">${OV.fmtRecord(recOf(gemId, name))}</span>
      </div>`;

    return pairings.map(p => {
      const w1 = p.winner === 'p1', w2 = p.winner === 'p2';
      const n  = OV.tableNo(p);
      const note = !p.done ? '' : (!w1 && !w2) ? OV.t('finished') : '';

      return `<div class="tk-item">
        <div class="tk-head"><span>${n ? OV.esc(OV.t('table', { n })) : ''}</span>${note ? `<i>${note}</i>` : ''}</div>
        ${row(p.p1, p.p1GemId, w1 ? ' win' : w2 ? ' lose' : '')}
        ${row(p.p2, p.p2GemId, w2 ? ' win' : w1 ? ' lose' : '')}
      </div>`;
    }).join('');
  }

  let last = null;

  function render() {
    if (!last) return;
    const { tdata, heroOf } = last;
    const round = tdata.rounds.length ? tdata.rounds[tdata.rounds.length - 1] : null;

    $('sub').textContent = tdata.meta?.title || '';

    if (ticker) {
      $('tk-ttl').textContent = round ? OV.roundName(tdata, round) : OV.t('pairings');
      $('tk-sub').textContent = round ? `${OV.t('pairings')} · ${round.done} / ${round.total}` : '';
    }

    if (!round) {
      $('ttl').textContent  = OV.t('pairings');
      $('tag').textContent  = '';
      $('side').innerHTML   = '';
      $('fill').style.width = '0';
      list.show(ticker ? tickerHtml([]) : `<div class="board-empty">${OV.t('noPairings')}</div>`, 0);
      return;
    }

    const total = round.total || 0;
    const done  = Math.max(0, Math.min(total, round.done));

    $('ttl').textContent  = OV.roundName(tdata, round);
    $('tag').textContent  = OV.t('pairings');
    $('side').innerHTML   = `<div class="bh-num">${done}<i> / ${total}</i></div><div class="bh-note">${OV.t('tablesDone')}</div>`;
    $('fill').style.width = (total ? done / total * 100 : 0) + '%';

    const sorted = [...round.pairings].sort((a, b) => (OV.tableNo(a) || 999) - (OV.tableNo(b) || 999));
    // Records as they stood before this round — what "7–1" next to a name means.
    list.show(ticker ? tickerHtml(sorted, heroOf, OV.records(tdata, round.elimination ? 0 : round.round))
                     : rowsHtml(sorted, heroOf), sorted.length);
  }

  async function refresh() {
    try {
      last = await OV.loadEvent();
      render();
      OV.badgeOk(Math.round(REFRESH / 1000));
    } catch (err) {
      OV.badge(err.message, true);
    }
  }

  // Name mode and language switch live, without an OBS reload.
  OV.initSettings(render).then(refresh);
  setInterval(refresh, REFRESH);
  OV.onRefresh(refresh);
</script>
</body>
</html>
