<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAB Standings</title>
  <link rel="stylesheet" href="/shared/overlay.css">
  <style>
    /* width-capped and centred, so rank, name and record stay one line the eye can follow */
    .srow {
      display: flex;
      align-items: center;
      gap: 0.8em;
      width: min(100% - 3.2em, 56em);
      margin: 0.5em auto 0;
      padding: 0.45em 1.3em;
      border-radius: 0.4em;
      background: var(--surface);
      box-shadow: var(--lift);
    }
    /* top 3: accent edge and glow, no tinted stripe */
    .srow.top { box-shadow: var(--lift), inset 0.22em 0 0 var(--accent), var(--glow); }

    .rank {
      width: 2.2em;
      flex-shrink: 0;
      text-align: right;
      font-family: var(--font-head);
      font-size: 1.15em;
      font-weight: 700;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .srow.top .rank { color: var(--accent); }

    .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.05em; }
    .nm, .hero { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nm   { font-size: 1.2em; line-height: 1.2; color: var(--text); }
    .hero { font-size: 0.75em; line-height: 1.25; color: var(--text-dim); }
    .srow.top .nm { font-weight: 700; }

    .rec {
      flex-shrink: 0;
      min-width: 3.4em;
      text-align: right;
      font-family: var(--font-head);
      font-size: 1.35em;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .rec i { font-style: normal; font-weight: 600; color: var(--text-dim); }
  </style>
</head>
<body class="board">
<div class="overlay-frame">
  <div class="board-head">
    <div class="bh-main">
      <div class="bh-title"><span id="ttl">–</span><span class="bh-tag" id="tag"></span></div>
      <div class="bh-sub" id="sub"></div>
    </div>
    <div class="bh-side" id="side"></div>
  </div>
  <div class="scroll-viewport" id="vp">
    <div class="scroll-track" id="tr"></div>
  </div>
</div>
<div class="tk">
  <div class="tk-label">
    <div class="tk-ttl" id="tk-ttl">–</div>
    <div class="tk-sub" id="tk-sub"></div>
  </div>
  <div class="tk-view" id="tk-view"><div class="tk-track" id="tk-track"></div></div>
</div>
<div id="status-badge">Loading…</div>

<script src="/shared/overlay.js"></script>
<script>
  const REFRESH = OV.refreshMs;
  const $ = id => document.getElementById(id);
  // ?mode=ticker: one-line strip instead of the board
  const ticker = OV.initTicker();
  const list = ticker || OV.scroller($('vp'), $('tr'), { speed: OV.speed });
  // ?top=16: leading places only, a 128-player ticker takes minutes
  const TOP = parseInt(OV.params.get('top'), 10) || 0;

  // fully completed Swiss rounds: basis for the loss column, which GEM's
  // standings CSV lacks
  function completedSwissRounds(tdata) {
    return tdata.rounds.filter(r => !r.elimination && r.total > 0 && r.done >= r.total).length;
  }

  // No standings from GEM yet (round 1 still running): count them off the
  // pairings. Players are matched by id, the two lists spell names differently.
  function calcStandings(tdata) {
    const recOf = OV.records(tdata);
    let players = tdata.players;
    if (!players.length) {
      const seen = new Map();
      tdata.rounds.forEach(r => r.pairings.forEach(p => {
        [[p.p1, p.p1GemId], [p.p2, p.p2GemId]].forEach(([name, gemId]) => {
          if (gemId && !seen.has(gemId)) seen.set(gemId, { name, gemId, hero: null });
        });
      }));
      players = [...seen.values()];
    }
    return players
      .map(p => ({ ...p, rec: recOf(p.gemId, p.name) || { w: 0, l: 0, d: 0 } }))
      .sort((x, y) => y.rec.w - x.rec.w || x.rec.l - y.rec.l || y.rec.d - x.rec.d)
      .map((p, i) => ({ name: p.name, gemId: p.gemId, hero: p.hero, wins: p.rec.w, rank: i + 1 }));
  }

  function rowsHtml(rows) {
    if (!rows.length) return `<div class="board-empty">${OV.t('noStandings')}</div>`;
    return rows.map(p => `<div class="srow${p.rank <= 3 ? ' top' : ''}">
        <div class="rank">${p.rank}</div>
        ${OV.hw(p.hero, '2.5em')}
        <div class="who">
          <span class="nm">${OV.esc(OV.fmtName(p.name))}</span>
          ${p.hero ? `<span class="hero">${OV.esc(p.hero)}</span>` : ''}
        </div>
        <div class="rec">${p.wins}<i> – ${p.losses}</i></div>
      </div>`).join('');
  }

  // ticker cell: two places stacked, like a table in the pairings
  function tickerHtml(rows) {
    if (!rows.length) return `<div class="tk-empty">${OV.t('noStandings')}</div>`;

    const row = p => `<div class="tk-row">
        <span class="tk-rank">${p.rank}</span>
        ${OV.hw(p.hero, null)}
        <span class="tk-nm">${OV.esc(OV.fmtName(p.name))}</span>
        <span class="tk-rec">${OV.fmtRecord(p.rec)}</span>
      </div>`;

    let html = '';
    for (let i = 0; i < rows.length; i += 2) {
      const a = rows[i], b = rows[i + 1];
      const head = b ? OV.t('places', { a: a.rank, b: b.rank }) : OV.t('place', { a: a.rank });
      html += `<div class="tk-item"><div class="tk-head"><span>${OV.esc(head)}</span></div>${row(a)}${b ? row(b) : ''}</div>`;
    }
    return html;
  }

  let last = null;

  function render() {
    if (!last) return;
    const { tdata, heroOf, standings } = last;
    const roundsDone = completedSwissRounds(tdata);

    const base = standings.length ? standings : calcStandings(tdata);
    // GEM's CSV has rank and wins (byes included), nothing else. Losses and
    // draws come from the pairings. "rounds minus wins" is only for a player
    // the pairings don't know: it turned every drop and draw into more losses.
    const recOf = OV.records(tdata);
    const all = base.map((s, i) => {
      const wins  = s.wins || 0;
      const found = recOf(s.gemId, s.name);
      const rec   = found ? { w: wins, l: found.l, d: found.d }
                          : { w: wins, l: Math.max(0, roundsDone - wins), d: 0 };
      return {
        name:   s.name,
        rank:   s.rank ?? i + 1,
        hero:   s.hero || heroOf(s.gemId, s.name),
        wins,
        losses: rec.l,
        rec
      };
    });
    const rows = TOP ? all.slice(0, TOP) : all;

    $('ttl').textContent = OV.t('standings');
    $('tag').textContent = roundsDone ? OV.t('afterRound', { n: roundsDone }) : '';
    $('sub').textContent = tdata.meta?.title || '';
    $('side').innerHTML  = all.length
      ? `<div class="bh-num">${all.length}</div><div class="bh-note">${OV.t('players')}</div>` : '';

    if (ticker) {
      $('tk-ttl').textContent = OV.t('standings');
      $('tk-sub').textContent = roundsDone ? OV.t('afterRound', { n: roundsDone }) : '';
    }

    list.show(ticker ? tickerHtml(rows) : rowsHtml(rows), ticker ? Math.ceil(rows.length / 2) : rows.length);
  }

  async function refresh() {
    try {
      last = await OV.loadEvent({ standings: true });
      render();
      OV.badgeOk(Math.round(REFRESH / 1000));
    } catch (err) {
      OV.badge(err.message, true);
    }
  }

  // live name mode and language, no OBS reload
  OV.initSettings(render).then(refresh);
  setInterval(refresh, REFRESH);
  OV.onRefresh(refresh);
</script>
</body>
</html>
